[project]
name = "rpn-gpt"
version = "0.1.0"
description = "An exact Forth machine compiled into the weights of Nemotron 3.5 Lightning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The CPU parts (the spec text_vm, the Forth reference, the problem generators, the row and grading tools) need only these.
dependencies = ["transformers>=4.57", "huggingface_hub", "jinja2", "rich==15.0.0"]  # jinja2: chat templates (loop_sim); rich: demos/live.py

[project.optional-dependencies]
# GPU parts: building / testing the compiled kernel and the composite (torch), serving (vLLM 0.29), grading MATH (math_verify).
gpu = ["torch", "safetensors", "math_verify"]  # plus vLLM 0.29, installed by playbooks/ansible/site.yml

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
